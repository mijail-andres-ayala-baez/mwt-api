# Database and API of MWT with one command: docker compose up -d
#
# - db:  PostgreSQL. The scripts in ./db run by themselves, in order (001, 002...),
#        but only the first time, while the database volume is still empty.
#        To start again from zero: docker compose down -v
# - api: the NestJS API, built from the Dockerfile. It waits until db is ready.
# - pgadmin: web viewer for the database, already pointing at db.
#
# On your computer: database on localhost:5433, API on http://localhost:4000,
# pgAdmin on http://localhost:5050 (database password: postgres)
services:
  db:
    image: postgres:17
    container_name: mwt-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mwt_dev
    ports:
      # Host port 5433 so it does not clash with a PostgreSQL already installed on 5432
      - '5433:5432'
    volumes:
      - mwt_db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Ready when PostgreSQL accepts connections
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mwt_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mwt-api
    environment:
      # Inside Docker the database is reached by its service name (db), on its own port 5432
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mwt_dev
      PORT: '3000'
      # The web (Next.js) runs on 3000 and calls the API from the browser
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      # Host port 4000, because the web already uses 3000
      - '4000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mwt-pgadmin
    environment:
      # Local tool only: these sample credentials never leave your computer
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Desktop mode: opens without a login screen
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      # The connection to db is created by itself the first time
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - mwt_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  mwt_db_data:
  mwt_pgadmin_data:
